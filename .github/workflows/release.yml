name: Auto-Version, Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de incremento de versión'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - patch
          - minor
          - major
      custom_version:
        description: 'Versión personalizada exacta (opcional, ej: 1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Auto-Version & Release Windows App
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Calculate & Bump Version
        id: version
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msg = @"
          ${{ github.event.head_commit.message }}
          "@
          Write-Host "Head Commit Message: $msg"
          
          ./scripts/bump-version.ps1 `
            -BumpType "${{ inputs.bump_type || 'auto' }}" `
            -CustomVersion "${{ inputs.custom_version || '' }}" `
            -CommitMessage "$msg"

      - name: Build and Test with Maven
        shell: pwsh
        run: |
          mvn -B clean package

      - name: Set up Inno Setup Compiler
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Package Windows Standalone App & Single-File Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.NEW_VERSION }}"
          Write-Host "Generando ejecutable autónomo para Windows (v$ver)..."
          
          # 1. Carpeta de entrada limpia exclusiva para el fat jar
          New-Item -ItemType Directory -Force "target/jpackage-in" | Out-Null
          Copy-Item "target/fretboard-trainer-$ver.jar" "target/jpackage-in/"
          
          # 2. jpackage genera la estructura autónoma con FretboardTrainer.exe e JRE 21 empotrado
          & jpackage `
            --name "FretboardTrainer" `
            --input "target/jpackage-in" `
            --main-jar "fretboard-trainer-$ver.jar" `
            --main-class "com.threadboardlearn.App" `
            --type app-image `
            --dest "target/dist" `
            --icon "src/main/resources/icons/app-icon.ico" `
            --app-version "$ver" `
            --vendor "ThreadBoardLearn" `
            --description "Guitar Fretboard Trainer"
          
          # 3. Compilar el Instalador en un ÚNICO archivo EXE (FretboardTrainer-Setup.exe)
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = (Get-Command ISCC -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compilando instalador único .exe con: $isccPath"
          & "$isccPath" /DMyAppVersion="$ver" installer/fretboard-trainer.iss
          Copy-Item "target/dist/FretboardTrainer-Setup.exe" "target/dist/FretboardTrainer-v$ver-Setup.exe"

          # 4. Empaquetar versión portable en ZIP por si se desea
          Compress-Archive -Path "target/dist/FretboardTrainer" -DestinationPath "target/dist/FretboardTrainer-v$ver-Windows.zip"
          Copy-Item "target/dist/FretboardTrainer-v$ver-Windows.zip" "target/dist/FretboardTrainer-Windows.zip"
          
          # 5. Copiar JARs
          Copy-Item "target/fretboard-trainer-$ver.jar" "target/dist/"
          Copy-Item "target/fretboard-trainer-$ver.jar" "target/dist/fretboard-trainer.jar"

      - name: Commit & Push Version Bump and Git Tag
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.NEW_VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add pom.xml README.md
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(release): bump version to v$ver [skip ci]"
            git push origin main
          }
          
          git tag -a "v$ver" -m "Release v$ver"
          git push origin "v$ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.NEW_VERSION }}
          name: Fretboard Trainer v${{ steps.version.outputs.NEW_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/dist/FretboardTrainer-v${{ steps.version.outputs.NEW_VERSION }}-Setup.exe
            target/dist/FretboardTrainer-Setup.exe
            target/dist/FretboardTrainer-v${{ steps.version.outputs.NEW_VERSION }}-Windows.zip
            target/dist/FretboardTrainer-Windows.zip
            target/dist/fretboard-trainer-${{ steps.version.outputs.NEW_VERSION }}.jar
            target/dist/fretboard-trainer.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

